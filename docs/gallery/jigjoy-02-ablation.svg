<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>Both schedules fail closed; concurrency changes the available safe plan</title><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#111e25"/><g transform="translate(64 52)"><path d="M0 0 H18 L54 32 M0 32 H54 M0 64 H18 L54 32" fill="none" stroke="#79d7c7" stroke-width="7"/><path d="M65 0 V64" stroke="#ffa58f" stroke-width="8"/></g><text x="154" y="103" font-size="54" fill="#f4f3e9" font-weight="700" >IncidentMesh</text><text x="1536" y="96" font-size="25" fill="#abbdbf" font-weight="500" text-anchor="end">02 / CONTROLLED EXPERIMENT</text><text x="64" y="208" font-size="65" fill="#f4f3e9" font-weight="700" >Same policy. Only scheduling changes.</text><text x="66" y="262" font-size="29" fill="#abbdbf" font-weight="400" >Same incident · Same eventual evidence · Same proposal · Same configured boundary</text><rect x="64" y="304" width="716" height="468" rx="16" fill="#f4f3e9"/><text x="96" y="356" font-size="31" fill="#111e25" font-weight="700" >CONCURRENT</text><text x="96" y="452" font-size="90" fill="#111e25" font-weight="700" >3 / 3</text><text x="329" y="420" font-size="28" fill="#111e25" font-weight="400" >required hypotheses</text><text x="329" y="456" font-size="28" fill="#111e25" font-weight="400" >at the boundary</text><rect x="96" y="487" width="652" height="68" rx="8" fill="#ffa58f"/><text x="117" y="535" font-size="40" fill="#111e25" font-weight="700" >BLOCKED</text><text x="96" y="599" font-size="30" fill="#111e25" font-weight="600" >conflicting-evidence</text><text x="96" y="672" font-size="34" fill="#111e25" font-weight="700" >Targeted canary + corroboration</text><text x="96" y="721" font-size="28" fill="#111e25" font-weight="400" >Actionable at the boundary.</text><rect x="820" y="304" width="716" height="468" rx="16" fill="#f4f3e9"/><text x="852" y="356" font-size="31" fill="#111e25" font-weight="700" >SEQUENTIAL</text><text x="852" y="452" font-size="90" fill="#111e25" font-weight="700" >1 / 3</text><text x="1085" y="420" font-size="28" fill="#111e25" font-weight="400" >required hypotheses</text><text x="1085" y="456" font-size="28" fill="#111e25" font-weight="400" >at the boundary</text><rect x="852" y="487" width="652" height="68" rx="8" fill="#ffa58f"/><text x="873" y="535" font-size="40" fill="#111e25" font-weight="700" >BLOCKED</text><text x="852" y="599" font-size="30" fill="#111e25" font-weight="600" >incomplete-required-evidence</text><text x="852" y="672" font-size="34" fill="#111e25" font-weight="700" >Hold / request missing evidence</text><text x="852" y="721" font-size="28" fill="#111e25" font-weight="400" >Targeted plan becomes available later.</text><text x="64" y="853" font-size="40" fill="#79d7c7" font-weight="700" >BOTH FAIL CLOSED.</text><text x="584" y="851" font-size="29" fill="#f4f3e9" font-weight="400" >Concurrency changes the available safe plan, not the safety rule.</text></g></svg>