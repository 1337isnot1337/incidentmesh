<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>Concurrency invalidates an in-flight stale plan</title><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#111e25"/><g transform="translate(64 52)"><path d="M0 0 H18 L54 32 M0 32 H54 M0 64 H18 L54 32" fill="none" stroke="#79d7c7" stroke-width="7"/><path d="M65 0 V64" stroke="#ffa58f" stroke-width="8"/></g><text x="154" y="103" font-size="54" fill="#f4f3e9" font-weight="700" >IncidentMesh</text><text x="1536" y="96" font-size="25" fill="#abbdbf" font-weight="500" text-anchor="end">02 / STALE-PLAN CAUSAL ABLATION</text><text x="64" y="208" font-size="65" fill="#f4f3e9" font-weight="700" >The evidence changed while it was thinking.</text><text x="66" y="262" font-size="29" fill="#abbdbf" font-weight="400" >Same rev-1 plan · Same action · Same evidence · Only peer scheduling changes</text><rect x="64" y="304" width="716" height="468" rx="16" fill="#f4f3e9"/><text x="96" y="356" font-size="31" fill="#111e25" font-weight="700" >CONCURRENT</text><rect x="96" y="390" width="248" height="76" rx="9" fill="#111e25"/><text x="121" y="441" font-size="34" fill="#f4f3e9" font-weight="700" >PLAN  rev 1</text><text x="371" y="444" font-size="52" fill="#111e25" font-weight="700" >→</text><rect x="452" y="390" width="296" height="76" rx="9" fill="#ffa58f"/><text x="478" y="441" font-size="31" fill="#111e25" font-weight="700" >BOUNDARY  rev 3</text><text x="96" y="552" font-size="83" fill="#a63a25" font-weight="800" >STALE</text><text x="96" y="606" font-size="31" fill="#111e25" font-weight="600" >targeted_canary_probe</text><rect x="96" y="635" width="652" height="66" rx="8" fill="#b7e9be"/><text x="116" y="681" font-size="34" fill="#111e25" font-weight="700" >→ request_corroboration</text><text x="96" y="744" font-size="27" fill="#111e25" font-weight="600" >Fresh rev-3 replan sees conflict.</text><rect x="820" y="304" width="716" height="468" rx="16" fill="#f4f3e9"/><text x="852" y="356" font-size="31" fill="#111e25" font-weight="700" >SEQUENTIAL</text><rect x="852" y="390" width="248" height="76" rx="9" fill="#111e25"/><text x="877" y="441" font-size="34" fill="#f4f3e9" font-weight="700" >PLAN  rev 1</text><text x="1127" y="444" font-size="52" fill="#111e25" font-weight="700" >→</text><rect x="1208" y="390" width="296" height="76" rx="9" fill="#b7e9be"/><text x="1234" y="441" font-size="31" fill="#111e25" font-weight="700" >BOUNDARY  rev 1</text><text x="852" y="552" font-size="83" fill="#22684f" font-weight="800" >FRESH</text><text x="852" y="606" font-size="31" fill="#111e25" font-weight="600" >targeted_canary_probe</text><rect x="852" y="635" width="652" height="66" rx="8" fill="#79d7c7"/><text x="872" y="681" font-size="34" fill="#111e25" font-weight="700" >BOUNDED PROBE CROSSES</text><text x="852" y="744" font-size="27" fill="#111e25" font-weight="600" >Same conflict arrives later.</text><text x="64" y="853" font-size="36" fill="#79d7c7" font-weight="700" >CONCURRENCY CHANGES WHICH DECISIONS ARE STILL VALID.</text></g></svg>