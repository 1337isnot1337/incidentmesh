<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>Missing required evidence blocks rollback</title><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#111e25"/><g transform="translate(64 52)"><path d="M0 0 H18 L54 32 M0 32 H54 M0 64 H18 L54 32" fill="none" stroke="#79d7c7" stroke-width="7"/><path d="M65 0 V64" stroke="#ffa58f" stroke-width="8"/></g><text x="154" y="103" font-size="54" fill="#f4f3e9" font-weight="700" >IncidentMesh</text><text x="1536" y="96" font-size="25" fill="#abbdbf" font-weight="500" text-anchor="end">04 / DEGRADATION RECEIPT</text><text x="64" y="216" font-size="72" fill="#f4f3e9" font-weight="700" >Missing evidence is not approval.</text><rect x="64" y="281" width="640" height="462" rx="16" fill="#f4f3e9"/><text x="100" y="338" font-size="26" fill="#111e25" font-weight="700" >REQUIRED RESPONDERS</text><text x="100" y="414" font-size="43" fill="#111e25" font-weight="700" >Trace</text><text x="100" y="454" font-size="26" fill="#22684f" font-weight="600" >Hypothesis available</text><text x="100" y="521" font-size="43" fill="#111e25" font-weight="700" >Dependency</text><text x="100" y="561" font-size="26" fill="#a63a25" font-weight="600" >TIMEOUT / DEGRADED</text><text x="100" y="628" font-size="43" fill="#111e25" font-weight="700" >Impact</text><text x="100" y="668" font-size="26" fill="#22684f" font-weight="600" >Hypothesis available</text><text x="765" y="331" font-size="41" fill="#f4f3e9" font-weight="600" >2 / 3 required hypotheses</text><rect x="762" y="370" width="774" height="157" rx="14" fill="#ffa58f"/><text x="800" y="485" font-size="113" fill="#111e25" font-weight="800" >BLOCKED</text><text x="764" y="580" font-size="32" fill="#ffa58f" font-weight="600" >incomplete-required-evidence</text><text x="764" y="644" font-size="35" fill="#f4f3e9" font-weight="400" >rollback_production intercepted</text><text x="764" y="709" font-size=