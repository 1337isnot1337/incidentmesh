<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">IncidentMesh — concurrent incident response</title>
  <desc id="desc">Evidence before action. Three concurrent signal paths meet a safety boundary.</desc>
  <rect width="1280" height="640" fill="#101820"/>
  <g transform="translate(72 72)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 0 H16 L46 26 M0 26 H46 M0 52 H16 L46 26" stroke="#72d5c2" stroke-width="5"/>
    <path d="M54 0 V52" stroke="#ffb18a" stroke-width="6"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="151" y="119" fill="#f0f5f7" font-size="54" font-weight="700" letter-spacing="-2">IncidentMesh</text>
    <text x="72" y="263" fill="#f0f5f7" font-size="62" font-weight="700" letter-spacing="-2">Concurrent incident response.</text>
    <text x="72" y="343" fill="#72d5c2" font-size="62" font-weight="700" letter-spacing="-2">Evidence before action.</text>
    <text x="72" y="552" fill="#b0c1cc" font-size="25">Shared evidence. An intercepted rollback. A safer next step.</text>
  </g>
  <g fill="none" stroke="#72d5c2" stroke-width="4" stroke-linecap="round">
    <path d="M950 442 H1030 L1130 506"/><path d="M990 506 H1130"/><path d="M950 570 H1030 L1130 506"/>
  </g>
  <path d="M1150 434 V578" stroke="#ffb18a" stroke-width="8" stroke-linecap="round"/>
</svg>
