<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">IncidentMesh: concurrent incident response that stops unsafe actions</title>
  <desc id="desc">Trace, Dependency, and Impact share evidence. The Safety Gate blocks rollback_production, Mozaik intercepts the action, and rewrites it to request_corroboration.</desc>

  <rect width="1200" height="620" rx="22" fill="#0d1117"/>
  <rect x="1" y="1" width="1198" height="618" rx="21" fill="none" stroke="#30363d" stroke-width="2"/>

  <!-- Identity -->
  <g transform="translate(54 46)">
    <rect x="0" y="0" width="78" height="78" rx="18" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
    <path d="M21 21 L39 39 L57 21 M21 57 L39 39 L57 57" fill="none" stroke="#8c959f" stroke-width="4" stroke-linecap="round"/>
    <circle cx="21" cy="21" r="5.5" fill="#58a6ff"/>
    <circle cx="57" cy="21" r="5.5" fill="#58a6ff"/>
    <circle cx="21" cy="57" r="5.5" fill="#58a6ff"/>
    <circle cx="57" cy="57" r="5.5" fill="#f0883e"/>
    <rect x="31" y="31" width="16" height="16" rx="4" fill="#f0f6fc"/>
    <path d="M34.5 39 l3.5 3.5 7-8" fill="none" stroke="#0d1117" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="154" y="95" fill="#f0f6fc" font-size="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="720" letter-spacing="-1.4">IncidentMesh</text>

  <text x="54" y="170" fill="#f0f6fc" font-size="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="680" letter-spacing="-0.7">Concurrent incident response</text>
  <text x="54" y="214" fill="#f0f6fc" font-size="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="680" letter-spacing="-0.7">that stops unsafe actions.</text>
  <text x="54" y="250" fill="#8b949e" font-size="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Independent responders share evidence before production decisions cross the safety boundary.</text>

  <!-- Core causal moment -->
  <rect x="54" y="286" width="1092" height="278" rx="18" fill="#0a0f15" stroke="#21262d" stroke-width="1.5"/>

  <!-- Responders -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="650">
    <rect x="84" y="326" width="164" height="44" rx="10" fill="#111820" stroke="#30363d"/>
    <rect x="84" y="392" width="164" height="44" rx="10" fill="#111820" stroke="#30363d"/>
    <rect x="84" y="458" width="164" height="44" rx="10" fill="#111820" stroke="#30363d"/>
    <circle cx="106" cy="348" r="5" fill="#58a6ff"/>
    <circle cx="106" cy="414" r="5" fill="#58a6ff"/>
    <circle cx="106" cy="480" r="5" fill="#58a6ff"/>
    <text x="122" y="354" fill="#c9d1d9">TRACE</text>
    <text x="122" y="420" fill="#c9d1d9">DEPENDENCY</text>
    <text x="122" y="486" fill="#c9d1d9">IMPACT</text>
  </g>

  <path d="M248 348 C278 348 274 394 306 408 M248 414 H306 M248 480 C278 480 274 434 306 420" fill="none" stroke="#484f58" stroke-width="2"/>
  <path d="M296 407 L307 414 L296 421" fill="none" stroke="#8c959f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Shared evidence -->
  <rect x="320" y="355" width="212" height="118" rx="14" fill="#111820" stroke="#3d444d" stroke-width="1.5"/>
  <text x="426" y="400" text-anchor="middle" fill="#8b949e" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.8">SHARED EVIDENCE</text>
  <path d="M379 430 H473" stroke="#58a6ff" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  <circle cx="380" cy="430" r="7" fill="#58a6ff"/>
  <circle cx="426" cy="430" r="7" fill="#58a6ff"/>
  <circle cx="472" cy="430" r="7" fill="#58a6ff"/>

  <path d="M532 414 H592" stroke="#d29922" stroke-width="2.5"/>
  <path d="M580 406 L594 414 L580 422" fill="none" stroke="#d29922" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Safety gate -->
  <rect x="606" y="334" width="252" height="160" rx="16" fill="#21170f" stroke="#9e6a03" stroke-width="1.8"/>
  <text x="732" y="377" text-anchor="middle" fill="#d29922" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700" letter-spacing="1.2">SAFETY GATE</text>
  <text x="732" y="443" text-anchor="middle" fill="#ff7b72" font-size="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="850" letter-spacing="0.4">BLOCKED</text>

  <!-- Action path -->
  <rect x="912" y="314" width="196" height="50" rx="11" fill="#111820" stroke="#3d444d" stroke-width="1.5"/>
  <text x="1010" y="346" text-anchor="middle" fill="#f0f6fc" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">rollback_production</text>

  <path d="M858 414 C890 414 884 394 912 394" fill="none" stroke="#f85149" stroke-width="2.5"/>
  <path d="M900 386 L914 394 L900 402" fill="none" stroke="#f85149" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1010 364 V387" stroke="#f85149" stroke-width="2.5"/>
  <path d="M1002 376 L1010 390 L1018 376" fill="none" stroke="#f85149" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="912" y="392" width="196" height="60" rx="12" fill="#2b1517" stroke="#f85149" stroke-width="1.8"/>
  <text x="1010" y="430" text-anchor="middle" fill="#ff7b72" font-size="20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="850" letter-spacing="0.8">INTERCEPTED</text>

  <path d="M1010 452 V478" stroke="#3fb950" stroke-width="2.5"/>
  <path d="M1002 467 L1010 481 L1018 467" fill="none" stroke="#3fb950" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="912" y="482" width="196" height="50" rx="11" fill="#0f1d16" stroke="#2ea043" stroke-width="1.8"/>
  <text x="1010" y="514" text-anchor="middle" fill="#7ee787" font-size="15.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">request_corroboration</text>
</svg>
