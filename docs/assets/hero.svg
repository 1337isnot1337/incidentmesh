<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Shared evidence. Rollback blocked.</title>
  <desc id="desc">In the deterministic demo, concurrent responders share conflicting evidence. The Safety Gate blocks the proposed rollback_production call, which Mozaik rewrites to request_corroboration. No production mutation occurs.</desc>
  <rect width="960" height="360" rx="16" fill="#101820"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="40" y="54" fill="#b0c1cc" font-size="22">Concurrent evidence changes the action.</text>
    <g fill="none" stroke="#72d5c2" stroke-width="3" opacity=".55">
      <path d="M640 92 H735 Q770 92 800 160"/>
      <path d="M680 160 H800"/>
      <path d="M620 228 H735 Q770 228 800 160"/>
    </g>
    <g fill="#72d5c2"><circle cx="640" cy="92" r="6"/><circle cx="680" cy="160" r="6"/><circle cx="620" cy="228" r="6"/></g>
    <path d="M816 87 V233" stroke="#ffb18a" stroke-width="7" stroke-linecap="round"/>
    <text x="40" y="143" fill="#ffb18a" font-size="70" font-weight="750" letter-spacing="-2">BLOCKED</text>
    <text x="42" y="186" fill="#b0c1cc" font-size="24">Safety Gate · conflicting evidence</text>
    <path d="M40 222 H560" stroke="#30404b"/>
    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="27">
      <text x="40" y="272" fill="#b0c1cc">- rollback_production</text>
      <text x="40" y="317" fill="#8ee3c7">+ request_corroboration</text>
    </g>
    <text x="920" y="317" text-anchor="end" fill="#b0c1cc" font-size="19">Deterministic demo</text>
  </g>
</svg>
