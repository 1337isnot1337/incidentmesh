<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">IncidentMesh disagreement changes the allowed action</title>
  <desc id="desc">Trace, Dependency, and Impact investigate concurrently. Three distinct hypotheses enter shared IncidentState, producing two contradictions. The Safety Gate blocks rollback, Impact replans to a canary, and Trace and Dependency corroborate.</desc>
  <rect width="1200" height="470" rx="24" fill="#0b1220"/>
  <rect x="1" y="1" width="1198" height="468" rx="23" fill="none" stroke="#334155" stroke-width="2"/>

  <text x="54" y="58" fill="#f8fafc" font-size="28" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="700">Disagreement changes what the system is allowed to do.</text>
  <text x="54" y="88" fill="#94a3b8" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">one incident.opened event → three independent responder lifecycles</text>

  <rect x="54" y="126" width="200" height="58" rx="12" fill="#0c4a6e" stroke="#38bdf8"/>
  <rect x="54" y="198" width="200" height="58" rx="12" fill="#115e59" stroke="#2dd4bf"/>
  <rect x="54" y="270" width="200" height="58" rx="12" fill="#4c1d95" stroke="#a78bfa"/>
  <text x="78" y="150" fill="#e0f2fe" font-size="18" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="700">Trace</text>
  <text x="78" y="172" fill="#bae6fd" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">hypothesis A</text>
  <text x="78" y="222" fill="#ccfbf1" font-size="18" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="700">Dependency</text>
  <text x="78" y="244" fill="#99f6e4" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">hypothesis B</text>
  <text x="78" y="294" fill="#ede9fe" font-size="18" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="700">Impact</text>
  <text x="78" y="316" fill="#ddd6fe" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">hypothesis C</text>

  <path d="M254 155 C315 155 323 202 372 217" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <path d="M254 227 H372" fill="none" stroke="#2dd4bf" stroke-width="2.5"/>
  <path d="M254 299 C315 299 323 252 372 237" fill="none" stroke="#a78bfa" stroke-width="2.5"/>

  <rect x="372" y="158" width="250" height="138" rx="16" fill="#111827" stroke="#64748b" stroke-width="2"/>
  <text x="397" y="190" fill="#f8fafc" font-size="19" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="700">Shared IncidentState</text>
  <text x="397" y="220" fill="#cbd5e1" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">3 distinct root-cause hypotheses</text>
  <text x="397" y="247" fill="#fbbf24" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700">2 contradictions</text>
  <text x="397" y="274" fill="#94a3b8" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">aggregate confidence 0.85</text>

  <path d="M622 227 H686" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <path d="M677 219 L688 227 L677 235" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="688" y="158" width="208" height="138" rx="16" fill="#18120a" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="714" y="190" fill="#fde68a" font-size="19" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="700">SAFETY GATE</text>
  <text x="714" y="235" fill="#fca5a5" font-size="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="800">BLOCKED</text>
  <text x="714" y="268" fill="#cbd5e1" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">rollback not allowed</text>

  <path d="M896 227 H942" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <path d="M933 219 L944 227 L933 235" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="944" y="126" width="202" height="202" rx="16" fill="#0f1a14" stroke="#22c55e" stroke-width="2.5"/>
  <text x="968" y="160" fill="#86efac" font-size="18" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="700">Behavior changes</text>
  <text x="968" y="198" fill="#f8fafc" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Impact → canary</text>
  <line x1="968" y1="216" x2="1120" y2="216" stroke="#334155"/>
  <text x="968" y="248" fill="#f8fafc" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Trace → corroborate</text>
  <text x="968" y="276" fill="#f8fafc" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Dependency → corroborate</text>
  <text x="968" y="307" fill="#86efac" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">2 follow-up evidence events</text>

  <rect x="54" y="372" width="1092" height="52" rx="12" fill="#111827"/>
  <text x="78" y="404" fill="#cbd5e1" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">concurrency proof: 3 / 3 responder pairs overlap</text>
  <text x="542" y="404" fill="#94a3b8" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">peer events observed while work is active</text>
  <text x="928" y="404" fill="#94a3b8" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">provider-free demo</text>
</svg>
