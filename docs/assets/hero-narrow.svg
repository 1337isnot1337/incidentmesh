<svg xmlns="http://www.w3.org/2000/svg" width="440" height="320" viewBox="0 0 440 320" role="img" aria-labelledby="title desc">
  <title id="title">Shared evidence. Rollback blocked.</title>
  <desc id="desc">The deterministic demo shares conflicting evidence and rewrites rollback_production to request_corroboration. No production mutation occurs.</desc>
  <rect width="440" height="320" rx="14" fill="#101820"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="24" y="42" fill="#b0c1cc" font-size="20">Concurrent evidence changes the action.</text>
    <text x="24" y="118" fill="#ffb18a" font-size="58" font-weight="750" letter-spacing="-2">BLOCKED</text>
    <text x="24" y="155" fill="#b0c1cc" font-size="21">Safety Gate · conflicting evidence</text>
    <path d="M24 184 H416" stroke="#30404b"/>
    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="24">
      <text x="24" y="224" fill="#b0c1cc">− rollback_production</text>
      <text x="24" y="263" fill="#8ee3c7">+ request_corroboration</text>
    </g>
    <text x="24" y="298" fill="#b0c1cc" font-size="17">Deterministic demo</text>
  </g>
</svg>
